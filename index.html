    // Villanásmentes témaválasztás: mentett érték, különben a rendszer beállítása.
    (function () {
      var t = null;
      try { t = localStorage.getItem("fegatt-theme"); } catch (e) {}
      if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.dataset.theme = t;
    })();
  </script>
